[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vmlease"
version = "0.1.0"
description = "Lease-based libvirt VM orchestration for AI-agent fleets"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
readme = "README.md"

[project.scripts]
vmlease = "vmlease.cli:main"

[tool.setuptools]
packages = ["vmlease"]
